<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Products | Franqlin E-commerce</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend&display=swap" rel="stylesheet" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles/products.css" />
</head>
<body>
<nav class="navbar">
    <a href="index.html" class="logo">Franqlin</a>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html" class="active" aria-current="page">Products</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="register.html">Register</a></li>
    </ul>
</nav>
<main>
    <!-- Category Filter -->
    <section class="filter-section" aria-label="Product Category Filter">
        <label for="categoryFilter">Filter by Category:</label>
        <select id="categoryFilter" aria-describedby="categoryFilterDesc" aria-label="Select Product Category">
            <option value="all">All</option>
            <option value="electronics">Electronics</option>
            <option value="fashion">Fashion</option>
            <option value="books">Books</option>
        </select>
        <span id="categoryFilterDesc" class="sr-only">Select a category to filter products</span>
    </section>

    <!-- Product Grid -->
    <section id="product-list" class="products-grid" aria-live="polite" aria-label="Product List">
        <!-- Products will be dynamically inserted here -->
    </section>

    <!-- Cart Button -->
    <button id="cartBtn" class="cart-button" aria-label="View Cart" aria-haspopup="dialog" aria-controls="cartPanel">
        <i class="bx bx-cart"></i> Cart
        <span id="cartCount" class="cart-count" aria-live="polite" aria-atomic="true">0</span>
    </button>

    <!-- Cart Sidebar -->
    <div id="overlay" class="overlay" tabindex="-1" hidden></div>
    <aside id="cartPanel" class="cart-panel" role="dialog" aria-modal="true" aria-labelledby="cartHeading" tabindex="-1" hidden>
        <div class="cart-header">
            <h2 id="cartHeading">Your Cart</h2>
            <button id="closeCartBtn" aria-label="Close Cart">&times;</button>
        </div>
        <div id="cartItems" class="cart-items" aria-live="polite" aria-relevant="additions removals">
            <!-- Cart items dynamically populated here -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                Total: $<span id="cartTotal">0.00</span>
            </div>
            <button id="clearCartBtn" class="clear-cart-btn">Clear Cart</button>
            <button id="checkoutBtn" class="checkout-btn">Proceed to Checkout</button>
        </div>
    </aside>
</main>

<script>
    // Checkout button redirects to checkout page
    document.getElementById("checkoutBtn").addEventListener("click", function () {
        window.location.href = "checkout.html";
    });
</script>
<script src="scripts/products.js"></script>
</body>
</html>
