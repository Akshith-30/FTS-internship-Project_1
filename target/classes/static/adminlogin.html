<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Login Page</title>

    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles/adminlogin.css">
</head>
<body>

<!-- Navbar -->
<nav>
    <a href="index.html" class="logo">Franqlin</a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </div>
</nav>

<!-- Background Image -->
<img class="background-img" src="images/bg3.jpg" alt="Background Image">

<!-- Admin Login Form -->
<form action="#" method="POST" class="login-form">
    <h1 class="login-title">Admin Login</h1>

    <div class="input-box">
        <i class="fa-solid fa-user" style="color: #787878;"></i>
        <input type="text" id="adminid" placeholder="Admin ID" required>
    </div>

    <div class="input-box">
        <i class="fa-solid fa-lock" style="color: #787878;"></i>
        <input type="password" id="password" placeholder="Password" required>
    </div>

    <div class="remember-forgot-box">
        <label for="remember">
            <input type="checkbox" id="remember">
            Remember Me
        </label>
        <a href="#">Forgot Password?</a>
    </div>

    <!-- Fixed: Use a submit button inside the form -->
    <button type="submit" class="login-btn">Login</button>

    <p class="custinst">
        Are you a customer?
        <a href="index.html">Home Page</a>
    </p>
</form>

<!-- Footer -->
<footer>
    <p>&copy; 2025 Franqlin Ecommerce App. All rights reserved.</p>
</footer>

<!-- Script -->
<script src="scripts/adminlogin.js"></script>
</body>
</html>
