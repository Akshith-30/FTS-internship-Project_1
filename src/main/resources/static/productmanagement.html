<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product Management</title>
    <link rel="stylesheet" href="styles/productmanagement.css" />
</head>
<body>
<img src="images/bg3.jpg" alt="Background" class="background-img" />

<h1>Product Management</h1>
<button id="addProductBtn" class="action-btn">Add Products</button>

<!-- Category Filter Dropdown -->
<label for="categoryFilter">Filter by Category:</label>
<select id="categoryFilter" class="action-btn">
    <option value="all">All</option>
    <option value="Electronics">Electronics</option>
    <option value="Clothing">Clothing</option>
    <option value="Books">Books</option>
    <!-- Add more categories as needed -->
</select>

<table id="productsTable">
    <thead>
    <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Price ($)</th>
        <th>Stock</th>
        <th>Remove Product</th>
        <th>Change Pricing</th>
    </tr>
    </thead>
    <tbody>
    <!-- Products will be dynamically injected here by JS -->
    </tbody>
</table>

<script src="scripts/productmanagement.js"></script>
</body>
</html>
