<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Page</title>
    <link rel="stylesheet" type="text/css" href="styles/register.css" />
    <link href="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Lexend&display=swap" rel="stylesheet" />
</head>
<body
        style="
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background-image: url('images/bg3.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  "
>
<!-- Navigation Bar -->
<nav class="navbar">
    <a href="index.html" class="logo">Franqlin</a>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="register.html">Register</a></li>
    </ul>
</nav>

<!-- Registration Form -->
<div style="flex: 1; display: flex; align-items: center; justify-content: center;">
    <form id="registrationForm" class="reg-form" method="POST" action="/api/users/register">
        <h1 class="reg-title">Registration Form</h1>
        <div class="input-box">
            <input type="text" placeholder="Full Name" name="fullName" required />
        </div>
        <div class="input-box">
            <input type="email" placeholder="Email" name="email" required />
        </div>
        <div class="input-box">
            <input type="password" placeholder="Password" name="password" required />
        </div>
        <div class="input-box">
            <input type="text" placeholder="Address" name="address" required />
        </div>
        <div class="input-box">
            <input type="tel" placeholder="Phone number" name="phone" pattern="[0-9]{10}" title="Enter 10-digit phone number" />
        </div>
        <div class="input-box">
            <input type="date" name="dob" required />
        </div>
        <div class="gender-row">
            <div class="input-box">
                <select name="gender" required aria-label="Select Gender">
                    <option value="" disabled selected>Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>
        </div>
        <div class="input-box">
            <select id="state" name="state" required aria-label="Select State">
                <option value="" disabled selected hidden>Select State</option>
                <option value="andhra_pradesh">Andhra Pradesh</option>
                <option value="bihar">Bihar</option>
                <option value="delhi">Delhi</option>
                <option value="gujarat">Gujarat</option>
                <option value="karnataka">Karnataka</option>
                <option value="kerala">Kerala</option>
                <option value="maharashtra">Maharashtra</option>
                <option value="odisha">Odisha</option>
                <option value="punjab">Punjab</option>
                <option value="rajasthan">Rajasthan</option>
                <option value="tamil_nadu">Tamil Nadu</option>
                <option value="telangana">Telangana</option>
                <option value="uttar_pradesh">Uttar Pradesh</option>
                <option value="west_bengal">West Bengal</option>
            </select>
        </div>
        <div class="button-container">
            <button type="reset" class="reset-btn">Reset</button>
            <button type="submit" class="reg-btn">Register</button>
        </div>
        <p class="register">
            Have an account?
            <a href="login.html">Login</a>
        </p>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.js"></script>
<script src="scripts/register.js"></script>
</body>
</html>
