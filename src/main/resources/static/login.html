<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/login.css">
</head>
<body>
<img class="background-img" src="images/bg3.jpg" alt="Background Image">

<form action="#" class="login-form">
    <h1 class="login-title">Login Page</h1>

    <div class="input-box">
        <i class="fa-solid fa-user" style="color: #787878;"></i>
        <input type="text" id="username" placeholder="Username" required>
    </div>
    <div class="input-box">
        <i class="fa-solid fa-lock" style="color: #787878;"></i>
        <input type="password" id="password" placeholder="Password" required>
    </div>

    <div class="remember-forgot-box">
        <label for="remember">
            <input type="checkbox" id="remember">
            Remember Me
        </label>
        <a href="#">Forgot Password?</a>
    </div>

    <button class="login-btn">Login</button>
    <p class="registerifno">
        Don't have an account?
        <a href="register.html">Register</a>
    </p>
</form>

<footer>
    <p>&copy; 2025 Franqlin Ecommerce App. All rights reserved.</p>
</footer>
<script src="login.js"></script>
</body>
</html>
