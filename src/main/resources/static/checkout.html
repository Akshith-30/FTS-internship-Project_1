<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Checkout Page</title>
    <link rel="stylesheet" href="styles/checkout.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="cart-icon">
    <i class="fas fa-shopping-cart"></i>
</div>

<div class="main-wrapper">
    <div class="box left-box">
        <h2>Delivery Address</h2>
        <form id="checkoutForm">
            <label for="street">Street:</label>
            <input type="text" id="street" name="street" required>

            <label for="city">City:</label>
            <input type="text" id="city" name="city" required>

            <label for="state">State:</label>
            <input type="text" id="state" name="state" required>

            <label for="postalCode">Postal Code:</label>
            <input type="text" id="postalCode" name="postalCode" required>

            <label for="country">Country:</label>
            <input type="text" id="country" name="country" required>

            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>

    <div class="box right-box">
        <h2>Order Summary</h2>
        <div class="cart-items" id="checkoutCartItems">
            <!-- Dynamic cart items will be inserted here -->
        </div>
        <div class="summary" id="checkoutSummary">
            <p>Total: $<span id="itemTotal">0.00</span></p>
            <p>Shipping: $<span id="shippingCost">15.00</span></p>
            <p><strong>Total Cost: $<span id="totalCost">0.00</span></strong></p>
        </div>
        <div class="actions">
            <button class="checkout-btn">Proceed to Pay</button>
            <button class="store-btn">Go to Store</button>
        </div>
    </div>
</div>

<script src="scripts/checkout.js"></script>
</body>
</html>
